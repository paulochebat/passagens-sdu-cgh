name: Coleta de passagens

on:
  schedule:
    - cron: "17 9 * * 1,4"   # segundas e quintas, 09:17 UTC (06:17 em Brasília)
  workflow_dispatch:          # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar preços
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python collect.py

      - name: Gerar relatório
        run: python build_dashboard.py

      - name: Salvar base e relatório no repositório
        run: |
          git config user.name "coletor-passagens"
          git config user.email "coletor-passagens@users.noreply.github.com"
          git add passagens.db docs/index.html
          git diff --staged --quiet || git commit -m "Coleta $(date -u +%F)"
          git push
